name: hf-keepalive

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send daily prompt
        env:
          HF_SPACE_URL: https://yousefsg-chatgpt-api.hf.space
          API_KEY: gptkey0
        run: |
          python3 .github/scripts/hf_keepalive.py
